<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CCAR-F Practice Console</title>
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/card.css" />
<link rel="stylesheet" href="styles/results.css" />
<link rel="stylesheet" href="styles/modal.css" />
</head>
<body>

  <header class="app-header">
    <div class="brand"><strong>CCAR-F</strong> Practice Console</div>
    <div class="exam-picker" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-owns="examList">
      <input id="examSearch" type="text" placeholder="Search exams…" autocomplete="off" aria-autocomplete="list" aria-controls="examList" />
      <button type="button" id="examToggle" class="picker-toggle" tabindex="-1" aria-label="Toggle exam list">
        <svg viewBox="0 0 12 8" width="12" height="8" aria-hidden="true"><path d="M1 1.5 6 6.5 11 1.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <ul id="examList" role="listbox" hidden></ul>
    </div>
    <div class="topbar-actions">
      <div class="shortcuts-hint">
        <button type="button" class="icon-btn" id="shortcutsBtn" aria-haspopup="true" aria-expanded="false" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"></path>
          </svg>
        </button>
        <div class="shortcuts-panel" id="shortcutsPanel" role="tooltip" hidden>
          <div class="shortcuts-row"><kbd>&larr;</kbd><span>Previous question</span></div>
          <div class="shortcuts-row"><kbd>&rarr;</kbd><span>Next question</span></div>
        </div>
      </div>
      <button type="button" class="icon-btn theme-toggle" id="themeToggle" aria-label="Switch to light mode" title="Switch to light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar" aria-label="Question navigator"></nav>

  <main id="main">
    <div class="empty-state" id="emptyState">
      <div class="big">No exam loaded</div>
      <p>Pick an exam above to begin.</p>
    </div>
  </main>

  <div class="modal-overlay" id="modeModal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modeModalTitle">
      <div class="modal-title" id="modeModalTitle">How do you want to practice?</div>
      <p class="modal-subtitle">Choose a mode before starting the exam.</p>
      <div class="mode-options">
        <label class="mode-option" data-mode="review">
          <input type="radio" name="practiceMode" value="review" checked>
          <span>
            <div class="mode-option-title">Review</div>
            <div class="mode-option-desc">Feedback and explanations after each question. No time limit.</div>
          </span>
        </label>
        <label class="mode-option" data-mode="timed">
          <input type="radio" name="practiceMode" value="timed">
          <span>
            <div class="mode-option-title">Timed</div>
            <div class="mode-option-desc">Exam-like, timed environment. See your score and explanations at the end of the quiz.</div>
          </span>
        </label>
      </div>
      <div class="modal-controls">
        <button type="button" class="btn btn-ghost" id="modeCancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="modeStartBtn">Start</button>
      </div>
    </div>
  </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
